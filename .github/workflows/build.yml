name: "Build & Release Cross-Platform Installers"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-micmorph:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target: "aarch64-apple-darwin"
            os_name: "macOS-AppleSilicon"
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            os_name: "Windows-x64"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install macOS System Dependencies
        if: matrix.platform == 'macos-latest'
        run: |
          brew install sound-touch

      - name: Install Windows System Dependencies (NSIS)
        if: matrix.platform == 'windows-latest'
        run: |
          choco install nsis -y

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Desktop Application (Tauri v2)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'MicMorph v__VERSION__'
          releaseBody: 'Automated release for MicMorph cross-platform desktop application.'
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MicMorph-${{ matrix.os_name }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
          if-no-files-found: warn
