[package]
name = "micmorph"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[lib]
name = "micmorph_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Audio I/O
cpal = "0.15"

# Pitch shifting — SoundTouch via Homebrew (brew install sound-touch)
soundtouch = "0.5"

# Thread-safe state sharing
parking_lot = "0.12"

# Date and time calculations
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.9"

[profile.release]
opt-level = "z"      # Optimize specifically for binary size
lto = true           # Enable Link-Time Optimization across crates
codegen-units = 1    # Minimize parallel codegen units to maximize size optimization
panic = "abort"      # Abort on panic to remove stack unwinding tables
strip = true         # Strip all debug symbols and symbol tables from the binary
